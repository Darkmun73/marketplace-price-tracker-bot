spring:
  application:
    name: MarketplacePriceTrackerBot
  docker:
    compose:
      file: ./docker-compose.dev.yml
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASS}
bot:
  token: ${BOT_TOKEN}
  commands:
    start:
      name: "/start"
