name: marketplace-price-tracker-bot
services:
  bot:
    build: .
    image: price-tracker-bot:latest
    environment:
      - BOT_TOKEN
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME
      - DB_USER
      - DB_PASS
    depends_on:
      - db
    networks:
      - main
  db:
    image: postgres:18.6-alpine
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/postgresql
    networks:
      - main
networks:
  main:
volumes:
  dbdata: