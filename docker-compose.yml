name: marketplace-price-tracker
services:
  bot:
    build: .
    image: price-tracker-bot:latest
    environment:
      - BOT_TOKEN
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME
      - DB_USER
      - DB_PASS
    depends_on:
      - db
    networks:
      - main
  db:
    extends:
      service: db
      file: docker-compose.services.yml
    networks:
      - main
networks:
  main:
volumes:
  dbdata: